[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perch-stereo"
version = "1.0.0"
description = "Trained NCNN stereo perch segmentation and triggered depth measurement"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "opencv-contrib-python>=4.10,<5",
    "ncnn==1.0.20260526",
]

[project.scripts]
perch-detector = "perch.cli:camera_main"
perch-video-seg = "perch.cli:video_main"

[tool.setuptools.packages.find]
where = ["src"]
